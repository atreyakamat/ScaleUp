<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="45%" stop-color="#091428" />
      <stop offset="100%" stop-color="#0d1b38" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTopLeft" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filter for Card Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#020617" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowTopLeft)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowBottomRight)" />
  <rect width="1200" height="380" rx="16" fill="url(#centerGlow)" />

  <!-- Subtle Cyber Tech Grid lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
    <line x1="960" y1="0" x2="960" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Central Logo Emblem Box -->
  <g transform="translate(100, 75)">
    <!-- Shadow Box -->
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#0b1733" stroke="url(#borderGrad)" stroke-width="2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logoGrad)" opacity="0.25" />
    
    <!-- Sparkles / Upscale Symbol -->
    <path d="M40 18L43.8 33.2L59 37L43.8 40.8L40 56L36.2 40.8L21 37L36.2 33.2L40 18Z" fill="#38bdf8" />
    <circle cx="56" cy="22" r="3.5" fill="#bae6fd" />
    <circle cx="24" cy="52" r="2.5" fill="#60a5fa" />
  </g>

  <!-- Title & Version Tag -->
  <g transform="translate(205, 125)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#titleGrad)" letter-spacing="-1.5">ScaleUp</text>
    
    <!-- Version Pill -->
    <rect x="225" y="-36" width="95" height="26" rx="6" fill="#1e3a8a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
    <text x="272" y="-19" font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-weight="700" font-size="12" fill="#93c5fd" text-anchor="middle">v1.1.0-PROD</text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="205" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="-0.2">
    Hardware-Accelerated Local AI Super-Resolution &amp; Batch Upscaling Engine
  </text>
  
  <text x="205" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="15" fill="#64748b">
    Powered by NCNN Vulkan C++ • Zero PyTorch Overhead (&lt;60MB RAM) • Native AMD RADV &amp; Mesa Optimization
  </text>

  <!-- Feature Chips / Badges Row -->
  <g transform="translate(100, 245)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="50" rx="12" fill="#0c1938" fill-opacity="0.9" stroke="#1e3a8a" stroke-width="1.5" />
      <circle cx="28" cy="25" r="7" fill="#34d399" />
      <text x="46" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#f1f5f9">NCNN Vulkan</text>
      <text x="46" y="38" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">FP16 Compute Backend</text>
    </g>

    <!-- Chip 2 -->
    <g transform="translate(230, 0)">
      <rect width="230" height="50" rx="12" fill="#0c1938" fill-opacity="0.9" stroke="#1e3a8a" stroke-width="1.5" />
      <circle cx="28" cy="25" r="7" fill="#38bdf8" />
      <text x="46" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#f1f5f9">AMD Vega 8 Tuned</text>
      <text x="46" y="38" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Zero VRAM Crash / RADV</text>
    </g>

    <!-- Chip 3 -->
    <g transform="translate(480, 0)">
      <rect width="240" height="50" rx="12" fill="#0c1938" fill-opacity="0.9" stroke="#1e3a8a" stroke-width="1.5" />
      <circle cx="28" cy="25" r="7" fill="#818cf8" />
      <text x="46" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#f1f5f9">Dark Blue Glassmorphism</text>
      <text x="46" y="38" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">Split Slider &amp; 4x Zoom</text>
    </g>

    <!-- Chip 4 -->
    <g transform="translate(740, 0)">
      <rect width="240" height="50" rx="12" fill="#0c1938" fill-opacity="0.9" stroke="#1e3a8a" stroke-width="1.5" />
      <circle cx="28" cy="25" r="7" fill="#fbbf24" />
      <text x="46" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#f1f5f9">Docker &amp; CLI Daemon</text>
      <text x="46" y="38" font-family="-apple-system, sans-serif" font-weight="500" font-size="11" fill="#64748b">ScaleUp --bg / Compose</text>
    </g>
  </g>

  <!-- Bottom Mini Footer in Banner -->
  <g transform="translate(100, 335)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">Arch Linux • Hyprland • FastAPI • React 18 • Vite • 100% Local &amp; Private</text>
  </g>
  <g transform="translate(1100, 335)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="end">github.com/atreyakamat/ScaleUp</text>
  </g>
</svg>
